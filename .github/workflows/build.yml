name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NX_KEYSTORE_PASSWORD: nxteam2026
  NX_KEY_ALIAS: nxkey
  NX_KEY_PASSWORD: nxteam2026

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/nx.keystore" -alias nxkey -keyalg RSA -keysize 2048 -validity 10000 -storepass nxteam2026 -keypass nxteam2026 -dname "CN=NX Team, OU=NX, O=NX Team, L=Istanbul, S=Istanbul, C=TR"
          echo "NX_KEYSTORE=$GITHUB_WORKSPACE/nx.keystore" >> $GITHUB_ENV

      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee build_output.txt

      - name: Collect error log
        if: failure()
        run: |
          grep -n -A 40 -i -E "error:|FAILURE:|Caused by|Execution failed" build_output.txt > error.txt || cp build_output.txt error.txt
          tail -c 200000 build_output.txt >> error.txt

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error
          path: error.txt

      - name: Report sizes
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NXAutoClicker-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NXAutoClicker-release
          path: app/build/outputs/apk/release/*.apk
