name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore $GITHUB_WORKSPACE/nx.keystore \
            -alias nxkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass nxteam2026 \
            -keypass nxteam2026 \
            -dname "CN=NX Team, OU=NX, O=NX Team, L=Istanbul, S=Istanbul, C=TR"

      - name: Inject signing config
        run: |
          python3 - <<'PY'
          path = 'app/build.gradle.kts'
          src = open(path).read()
          signing = '''
    signingConfigs {
        create("nx") {
            storeFile = file(System.getenv("GITHUB_WORKSPACE") + "/nx.keystore")
            storePassword = "nxteam2026"
            keyAlias = "nxkey"
            keyPassword = "nxteam2026"
        }
    }
'''
          src = src.replace('    buildTypes {', signing + '\n    buildTypes {', 1)
          src = src.replace('        debug {', '        debug {\n            signingConfig = signingConfigs.getByName("nx")', 1)
          src = src.replace('        release {', '        release {\n            signingConfig = signingConfigs.getByName("nx")', 1)
          open(path, 'w').write(src)
          PY

      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee build_output.txt

      - name: Collect error log
        if: failure()
        run: |
          grep -n -A 40 -i -E "error:|FAILURE:|Caused by|Execution failed" build_output.txt > error.txt || cp build_output.txt error.txt
          tail -c 200000 build_output.txt >> error.txt

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error
          path: error.txt

      - name: Report sizes
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NXAutoClicker-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NXAutoClicker-release
          path: app/build/outputs/apk/release/*.apk
